server {
    listen 80;
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
