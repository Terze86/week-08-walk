# Local development stack. Production hosting (on-prem or government cloud),
# TLS, secrets management and backups are defined in Phase 3.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims
      POSTGRES_DB: lims
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims"]
      interval: 5s
      retries: 10

  minio:
    # Object Lock must be enabled on the bucket at creation (see README).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lims
      MINIO_ROOT_PASSWORD: lims-dev-password
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./backend
    environment: &api_env
      LIMS_ENVIRONMENT: dev
      LIMS_AUTH_MODE: dev
      LIMS_DATABASE_URL: postgresql+psycopg://lims:lims@db:5432/lims
      LIMS_FILE_STORE: local
      LIMS_FILE_STORE_PATH: /app/var/files
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [files:/app/var]

  worker:
    build: ./backend
    environment: *api_env
    command: python -m app.worker
    depends_on: [api]

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  files:
